name: Notify Homebrew Tap

# FFR-600-2: the release producer moved off the mirror onto Forgejo (the
# ops-engine ReleaseHandler). The mirror is read-only distribution, so this
# workflow no longer keys on release-please's output. It fires on the push of
# a `v*` tag, which is exactly what mirror.yml copies verbatim from Forgejo
# when the ops-engine cuts a release. Only the producer changes; the tap
# payload stays byte-for-byte identical.
#
# If the ops-engine has not yet cut a faigrid release, no `v*` tag is pushed
# and this workflow simply never fires: no tap update, no error.

on:
  push:
    tags:
      - "v*"

jobs:
  notify:
    if: ${{ github.server_url == 'https://github.com' }}
    runs-on: ubuntu-latest
    steps:
      - name: Compute SHA256
        id: sha
        run: |
          VERSION="${GITHUB_REF_NAME#v}"
          URL="https://github.com/fusionAIze/faigrid/archive/refs/tags/v${VERSION}.tar.gz"
          SHA=$(curl -sL "$URL" | sha256sum | awk '{print $1}')
          echo "version=${VERSION}" >> "$GITHUB_OUTPUT"
          echo "sha256=${SHA}"      >> "$GITHUB_OUTPUT"

      - name: Dispatch to homebrew-tap
        uses: actions/github-script@v9
        with:
          github-token: ${{ secrets.TAP_GITHUB_TOKEN }}
          script: |
            await github.rest.repos.createDispatchEvent({
              owner: 'fusionAIze',
              repo:  'homebrew-tap',
              event_type: 'formula-update',
              client_payload: {
                formula: 'faigrid',
                version: '${{ steps.sha.outputs.version }}',
                sha256:  '${{ steps.sha.outputs.sha256 }}',
              },
            });
            console.log('Dispatched formula-update for faigrid v${{ steps.sha.outputs.version }}');
