name: Lint

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  # ── Shell: ShellCheck ───────────────────────────────────────────────────────
  shellcheck:
    name: ShellCheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Run ShellCheck
        uses: ludeeus/action-shellcheck@master
        with:
          ignore_paths: tests/*

  # ── Python: grid-messenger ──────────────────────────────────────────────────
  python-lint:
    name: Python (ruff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - uses: actions/setup-python@v6
        with:
          python-version: '3.12'
      - run: pip install ruff
      - name: Ruff check
        run: ruff check core/messenger/src/
      - name: Ruff format check
        run: ruff format --check core/messenger/src/

  # ── Version consistency ─────────────────────────────────────────────────────
  version-check:
    name: Version consistency
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Compare VERSION vs install.sh
        run: |
          FILE_VER="$(cat VERSION)"
          SCRIPT_VER="$(grep -oE '[0-9]+\.[0-9]+\.[0-9]+' install.sh | head -1)"
          echo "VERSION file : ${FILE_VER}"
          echo "install.sh   : ${SCRIPT_VER}"
          if [[ "$FILE_VER" != "$SCRIPT_VER" ]]; then
            echo "::error::Version mismatch: VERSION=${FILE_VER} install.sh=${SCRIPT_VER}"
            exit 1
          fi

  # ── CHANGELOG up-to-date ───────────────────────────────────────────────────
  changelog:
    name: Changelog (git-cliff)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
        with:
          fetch-depth: 0
      - uses: orhun/git-cliff-action@v4
        with:
          config: .cliff.toml
          args: --validate
        continue-on-error: true   # advisory only until CHANGELOG.md is seeded
