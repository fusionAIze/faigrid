name: Create Forgejo Release

# Forgejo is canonical; GitHub is the public mirror. This workflow adopts
# ops-engine's OWN shape: a `gate` job runs the pre-publication checks (release
# title, CHANGELOG notes, external audience) and the `release` job carries
# `needs: gate`, so a failing gate stops publication instead of running beside
# it. ops-engine later split the gate into its own job; faigate's derivative
# kept the gate as ordered steps inside ONE job and did not adopt the fix. This
# file adapts the source, not the derivative. Production releases are cut here,
# on Forgejo, by the ops-engine ReleaseHandler — the GitHub mirror does
# distribution only and never writes a release object.
#
# The five defects this replaces, and where each is now answered:
#   commit dump       -> the body is the CHANGELOG section for the tag, never
#                        `git log --oneline`
#   literal \n        -> the notes cross job boundaries as a heredoc-delimited
#                        output value; `printf %s` never touches them
#   bare-tag title    -> the title gate refuses a non-conforming name before any
#                        release object exists on either forge
#   one forge only    -> destinations come from the committed .ops.yaml; BOTH are
#                        published and a partial publication goes red
#   invented mirror   -> the canonical tag ref is pushed onto the mirror BEFORE
#   tag (v3.4.1)         publication, and both tags are peeled and compared after

on:
  push:
    tags:
      - "v*.*.*"
  workflow_dispatch:
    inputs:
      tag_name:
        description: "Tag to create release for (e.g. v1.0.0)"
        required: true
        type: string

jobs:
  # The gate is a GATE: the release job cannot run unless this job passes. A
  # refused title, a missing CHANGELOG section, or a body addressed at an
  # internal audience stops publication before any release object exists on
  # either forge.
  gate:
    runs-on: ubuntu-latest
    outputs:
      release_name: ${{ steps.title.outputs.release_name }}
      release_name_template: ${{ steps.title.outputs.release_name_template }}
      notes: ${{ steps.notes.outputs.notes }}
    steps:
      # A dispatch checks out the tag named by its input; a tag push keeps the
      # pushed ref, which is that same tag. The gate must read the TREE BEING
      # RELEASED, not the branch that dispatched it: on a dispatch the branch
      # could carry edits the tag does not (measured in the ledger, FM-001), so
      # without this the gate would validate one CHANGELOG and the release
      # publish the other. A tag push is unchanged.
      #
      # The shorthand form is accepted by the Forgejo runner and by actionlint;
      # this repository's own mirror.yml uses it in the same way.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}

      # The release title is a GATE, not an agreement. The name must be exactly
      # "fusionAIze Grid vX.Y.Z", or the taught prerelease form
      # "fusionAIze Grid vX.Y.Z-rcN"; a tag whose rendered title does not
      # conform is refused here with a named error, before any release object
      # exists on either forge. The prefix is committed (.release-title-prefix),
      # never a literal in this file, so FRL-006 can check it against the
      # layover's name_template.
      - name: Gate the release title
        id: title
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail
          PREFIX="$(cat .release-title-prefix)"
          RELEASE_NAME="${PREFIX} ${TAG_NAME}"
          python3 - "${RELEASE_NAME}" "${PREFIX}" <<'TITLE_GATE_PY'
          import re
          import sys

          name, prefix = sys.argv[1], sys.argv[2]
          NAME_RE = re.compile(
              r"^%s v[0-9]+\.[0-9]+\.[0-9]+(?:-rc[0-9]+)?$" % re.escape(prefix)
          )
          if not NAME_RE.match(name):
              sys.stderr.write(
                  "ReleaseTitleError: release name %r does not match the required "
                  "convention ^%s v[0-9]+\\.[0-9]+\\.[0-9]+$ or its prerelease "
                  "form ...-rc[0-9]+$. Refusing before any release object exists "
                  "on either forge.\n" % (name, prefix)
              )
              sys.exit(2)
          sys.stdout.write("title gate: %r conforms\n" % name)
          TITLE_GATE_PY
          echo "release_name=${RELEASE_NAME}" >> "$GITHUB_OUTPUT"
          # The release job renders its own title from NAME_TEMPLATE. Emitting
          # the template here, from the same PREFIX the gate just checked, is
          # what makes the gate binding: otherwise it validates one string while
          # another is published.
          echo "release_name_template=${PREFIX} {tag_name}" >> "$GITHUB_OUTPUT"

      # The release body is the CHANGELOG entry for this version, never commit
      # subjects. A tag whose version has no `## X.Y.Z` section fails here,
      # before any release object exists — which is the correct outcome: a
      # release with no authored notes is a release nobody can read.
      #
      # The extractor is a byte-for-byte copy of the one in ops-engine's own
      # release workflow, and it is stdlib-only on purpose: importing
      # ops_engine at this point would pull yaml and pydantic, which the bare
      # runner image does not carry. The heading pattern accepts every form
      # CHANGELOG.md uses, including the bracketed `## [1.8.0](...) (2026-08-22)`.
      - name: Extract release notes from CHANGELOG
        id: notes
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
        run: |
          set -euo pipefail

          NOTES="$(python3 - "$TAG_NAME" <<'PY'
          import re
          import sys

          HEADER_PATTERN = re.compile(
              r"^##\s+"
              r"(?:\[)?(?:[\w-]+\s+)?v?"
              r"(\d+\.\d+\.\d+(?:[-.\w]*)?)"
              r"(?:\])?"
              r".*$",
              re.MULTILINE,
          )

          tag = sys.argv[1]
          version = tag.lstrip("v")
          with open("CHANGELOG.md", encoding="utf-8") as fh:
              content = fh.read()
          matches = list(HEADER_PATTERN.finditer(content))
          target_match = None
          target_idx = -1
          for idx, m in enumerate(matches):
              if m.group(1) == version:
                  target_match = m
                  target_idx = idx
                  break
          if target_match is None:
              notes = ""
          else:
              start = target_match.end()
              if target_idx + 1 < len(matches):
                  end = matches[target_idx + 1].start()
              else:
                  end = len(content)
              notes = content[start:end].strip()
          if not notes:
              sys.stderr.write(
                  "MissingChangelogEntryError: no '## %s' section in CHANGELOG.md; "
                  "a release with no notes would post commit subjects, so the "
                  "release is refused.\n" % version
              )
              sys.exit(2)
          sys.stdout.write(notes)
          PY
          )"

          {
            echo "notes<<EOF"
            echo "${NOTES}"
            echo "EOF"
          } >> "$GITHUB_OUTPUT"

      # Generic tooling lives in the open base. ops-engine is OSS and publicly
      # mirrored, so this needs no credential — the same fetch the version gate
      # in mirror.yml already uses.
      #
      # Pinned to the v3.7.3 tag, the version the release job installs. Since
      # OE-007 the gate script carries no copy of the ticket check: it loads
      # `check_release_notes_audience` from
      # `src/ops_engine/modules/release_gates.py` by a path relative to its own
      # location. Fetching only the script would fail at import time, so BOTH
      # files arrive into the same relative layout and the engine's own gate
      # stays authoritative instead of a private copy of the regex. (This is the
      # shape capacium's and skillweave's release workflows already use.)
      - name: Fetch the audience gate (canonical, ops-engine)
        run: |
          set -euo pipefail
          GATE_ROOT="$RUNNER_TEMP/ops-engine-gate"
          mkdir -p "$GATE_ROOT/scripts" "$GATE_ROOT/src/ops_engine/modules"
          BASE="https://raw.githubusercontent.com/LangeVC/ops-engine/v3.7.3"
          curl -fsSL "$BASE/scripts/release_notes_audience_gate.py" \
            -o "$GATE_ROOT/scripts/release_notes_audience_gate.py"
          curl -fsSL "$BASE/src/ops_engine/modules/release_gates.py" \
            -o "$GATE_ROOT/src/ops_engine/modules/release_gates.py"

          # Prove what arrived. Without this the step reports success even when
          # it fetched an HTML page: a redirect to a login page returns 200 and
          # curl -f never triggers, so the failure surfaces later as a
          # SyntaxError on "<!DOCTYPE html>". Both files are parsed; the gate
          # resolves the second by its path relative to the first, so a syntax
          # error in either is a broken gate.
          for fetched in \
            "$GATE_ROOT/scripts/release_notes_audience_gate.py" \
            "$GATE_ROOT/src/ops_engine/modules/release_gates.py"; do
            python3 -c "import ast,sys; ast.parse(open(sys.argv[1]).read())" "$fetched" \
              || { echo "fetched file is not Python — first three lines:"; \
                   head -3 "$fetched"; exit 1; }
          done

      # The release body is addressed at an external reader. A section that
      # still names an internal ticket addresses the tracker that produced the
      # release, not the consumer the body is for.
      #
      # The engine classifies nothing by shape: the code-and-number form is
      # shared by internal ticket ids and by identifiers a reader legitimately
      # needs (CVE, RFC, ISO, PEP-8, UTF-8, SHA-256, TLS-1.3). It refuses a
      # ticket-shaped token only when its prefix appears in the vocabulary THIS
      # repository declares — the committed .ops.yaml's tracker_prefixes
      # (FAI, FFR, OPS, ADR), a reviewer-visible file rather than a shell
      # literal. The same single-line extractor the workflow layer owns is used
      # here, so the prefixes never become a literal in .forgejo/.
      - name: Gate the release notes for an external audience
        env:
          NOTES: "${{ steps.notes.outputs.notes }}"
        run: |
          set -euo pipefail
          NOTES_FILE="$(mktemp)"
          PREFIXES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE" "$PREFIXES_FILE"' EXIT
          printf '%s\n' "$NOTES" > "$NOTES_FILE"
          python3 - "$PREFIXES_FILE" <<'PREFIXES_PY'
          import sys
          from pathlib import Path

          out = sys.argv[1]
          prefixes = []
          ops = Path(".ops.yaml")
          if ops.exists():
              for raw in ops.read_text(encoding="utf-8").splitlines():
                  line = raw.split("#", 1)[0].strip()
                  if not line.startswith("tracker_prefixes:"):
                      continue
                  value = line[len("tracker_prefixes:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          prefixes.append(item)
          Path(out).write_text("\n".join(prefixes) + ("\n" if prefixes else ""),
                               encoding="utf-8")
          PREFIXES_PY
          python3 "$RUNNER_TEMP/ops-engine-gate/scripts/release_notes_audience_gate.py" \
            --ticket-prefixes "$PREFIXES_FILE" \
            "$NOTES_FILE"

  # The release job runs only after the gate passed. It calls the engine to
  # publish; it does not reimplement publication.
  release:
    needs: gate
    runs-on: ubuntu-latest
    steps:
      # A dispatch checks out the tag named by its input; a tag push keeps the
      # pushed ref, which is that same tag (github.ref is refs/tags/vX). The
      # expression selects the input for a dispatch and the pushed ref
      # otherwise, so a tag push checks out exactly what it did before. Without
      # this, a dispatch built the branch and published a tree that is not the
      # tag (measured: ledger FM-001 run 48745; elementeer-pro run 48583).
      #
      # fetch-depth 0 so the tag ref is present and can be peeled
      # (`refs/tags/<tag>^{}`) for the mirror-tag comparison below.
      - uses: actions/checkout@v4
        with:
          ref: ${{ github.event.inputs.tag_name || github.ref }}
          fetch-depth: 0

      # A dispatch names an EXISTING tag to release. The input is validated
      # before any build or publish: it must match v*, be a legal git ref name,
      # name a tag that exists on origin, and be the commit that was checked
      # out. A missing input falls back to the branch name and is refused by the
      # v* check rather than publishing a branch. A tag push runs no gate here
      # and is unchanged.
      - name: Resolve and validate the release tag
        if: github.event_name == 'workflow_dispatch'
        env:
          DISPATCH_TAG: "${{ github.event.inputs.tag_name }}"
        run: |
          set -euo pipefail
          TAG_NAME="$DISPATCH_TAG"
          case "$TAG_NAME" in
            v*) ;;
            *)
              echo "TagPatternError: '$TAG_NAME' does not match the v* tag pattern; refusing before any publish." >&2
              exit 2
              ;;
          esac
          if ! git check-ref-format "refs/tags/$TAG_NAME"; then
            echo "TagNameError: '$TAG_NAME' is not a legal tag name; refusing before any publish." >&2
            exit 2
          fi
          # Existence on origin, not just locally: for a lightweight tag origin
          # lists refs/tags/<tag> as the commit, for an annotated tag the peeled
          # refs/tags/<tag>^{} is the commit HEAD (the checked-out tag) resolves
          # to.
          TAG_SHA=$(git ls-remote --tags origin "refs/tags/$TAG_NAME" "refs/tags/$TAG_NAME^{}" 2>/dev/null \
            | awk '{ if ($2 ~ /\^\{\}$/) peeled=$1; else plain=$1 } END { print (peeled != "" ? peeled : plain) }' || true)
          if [ -z "$TAG_SHA" ]; then
            echo "UnknownTagError: '$TAG_NAME' is not an existing tag on origin; create the tag first. Refusing before any publish." >&2
            exit 2
          fi
          HEAD_SHA=$(git rev-parse HEAD)
          if [ "$HEAD_SHA" != "$TAG_SHA" ]; then
            echo "CheckoutMismatchError: HEAD $HEAD_SHA is not the commit of tag $TAG_NAME ($TAG_SHA); refusing before any publish." >&2
            exit 2
          fi
          echo "TAG_NAME=$TAG_NAME" >> "$GITHUB_ENV"
          echo "release tag: $TAG_NAME (commit $TAG_SHA)"

      # An older tag tree can predate the release chain: v1.10.2 carries no
      # release block in .ops.yaml and no credential_variable on either
      # destination — both were added to the branch after it. On a dispatch
      # only, the branch that runs this workflow supplies exactly those gate
      # files where the tag tree lacks them; the source tree that is published
      # stays the tag's, because nothing else is taken from the branch. A tag
      # push reads the tree as before and runs nothing here.
      - name: Take the release gates from the branch the tag tree predates
        if: github.event_name == 'workflow_dispatch'
        env:
          SOURCE_BRANCH: "${{ github.ref_name }}"
        run: |
          set -euo pipefail
          git fetch --no-tags origin "$SOURCE_BRANCH"
          if [ "$(git rev-parse FETCH_HEAD)" = "$(git rev-parse HEAD)" ]; then
            # The dispatch ref is the tag itself: it cannot carry what it
            # predates. Dispatch from the branch that carries the release gates.
            echo "GateSourceError: dispatch ref '$SOURCE_BRANCH' is the tag's own commit and cannot supply the release gates; dispatch from the branch that carries them." >&2
            exit 2
          fi
          NEED=()
          if ! { grep -q '^release:' .ops.yaml 2>/dev/null \
                 && grep -q '^[[:space:]]*credential_variable:' .ops.yaml 2>/dev/null; }; then
            NEED+=(.ops.yaml)
          fi
          if [ "${#NEED[@]}" -gt 0 ]; then
            git checkout FETCH_HEAD -- "${NEED[@]}"
            echo "gate files taken from $SOURCE_BRANCH: ${NEED[*]}"
          else
            echo "tag tree already carries every release gate file"
          fi

      # ReleaseHandler.publish_release creates the release on EVERY destination
      # resolved from the committed .ops.yaml and reports a partial publication
      # rather than swallowing it. Two forges carry two credentials, so the
      # adapter factory is given one credential per forge value; a destination
      # whose forge has no credential is a named refusal, never a silent
      # unauthenticated publication. Publication never parses a webhook, so the
      # webhook secret stays empty.
      #
      # The canonical git URL is composed from the config layer, never from
      # github.server_url. On this repository's self-hosted Forgejo runner,
      # github.server_url resolves to the runner-internal container address
      # (http://forgejo:3000) — not the organisation's forge (REL-023; declared
      # in .ops.yaml lines 43-49 and in ops-engine's CONTRACT.md lines 457-464).
      # The host comes from .ops.yaml's forge_hosts and the path from the
      # destination whose forge is forgejo; the `.git` suffix is what makes it a
      # fetchable remote for `git ls-remote`. The canonical repository is NOT
      # anonymously readable, whatever .ops.yaml's visibility field claims:
      # a credential-less HTTPS ls-remote is refused by the forge (measured
      # "Repository not found") and the API answers "Only signed in user is
      # allowed to call APIs." (403). The ls-remote therefore authenticates with
      # the FORGEJO_TOKEN this release job already holds. The file is read the
      # way the audience gate above reads
      # tracker_prefixes: stdlib only, line by line, because the bare runner
      # carries neither yaml nor pydantic.
      - name: Derive the canonical git URL from the config layer
        run: |
          set -euo pipefail
          python3 - <<'CANONICAL_URL_PY' >> "$GITHUB_ENV"
          import re
          import sys
          from pathlib import Path

          HOST_HAS_DOT = re.compile(r"\.")

          ops = Path(".ops.yaml")
          if not ops.exists():
              sys.stderr.write(
                  "::error::MissingOpsYamlError: no .ops.yaml at the repository "
                  "root; the canonical forge host and repository are a committed "
                  "file, not a CI variable. Refusing to derive a canonical git "
                  "URL from github.server_url.\n"
              )
              sys.exit(2)

          hosts = []
          forgejo_repo = ""
          current_forge = ""
          for raw in ops.read_text(encoding="utf-8").splitlines():
              line = raw.split("#", 1)[0].strip()
              if line.startswith("forge_hosts:"):
                  value = line[len("forge_hosts:"):].strip()
                  if value.startswith("[") and value.endswith("]"):
                      value = value[1:-1]
                  for item in value.split(","):
                      item = item.strip().strip("'\"")
                      if item:
                          hosts.append(item)
                  continue
              match = re.match(r"^-\s*forge:\s*(\S+)\s*$", line)
              if match:
                  current_forge = match.group(1).strip("'\"")
                  continue
              match = re.match(r"^repo:\s*(\S+)\s*$", line)
              if match and current_forge:
                  if current_forge.lower() == "forgejo":
                      forgejo_repo = match.group(1).strip("'\"")
                  current_forge = ""

          # A missing or empty forge_hosts entry is refused by name. The host is
          # organisation knowledge (ops-engine CONTRACT.md lines 457-464): with no
          # entry there is nothing to compose the URL from, and the runner's
          # internal address must never stand in for the organisation's forge.
          if not hosts:
              sys.stderr.write(
                  "::error::MissingForgeHostError: .ops.yaml declares no "
                  "forge_hosts; the organisation's forge host belongs in the "
                  "config layer, not on the runner. Refusing to derive a "
                  "canonical git URL from github.server_url.\n"
              )
              sys.exit(2)

          # A dotless entry is refused by name at the register boundary, exactly
          # as ops-engine's own config loader does (config_loader.py
          # ``_forge_hosts_are_hostnames``): a bare label is a forge type, a
          # header prefix or a container name before it is anybody's hostname.
          for host in hosts:
              if not HOST_HAS_DOT.search(host):
                  sys.stderr.write(
                      "::error::ForgeHostRegisterError: %r carries no dot, so it "
                      "is a forge type, a header prefix or a package name rather "
                      "than a hostname; an internal address must not silently "
                      "become an organisation's forge. Refusing to derive a "
                      "canonical git URL from github.server_url.\n" % host
                  )
                  sys.exit(2)

          if not forgejo_repo:
              sys.stderr.write(
                  "::error::MissingForgejoDestinationError: .ops.yaml declares no "
                  "destination whose forge is forgejo; the canonical repository is "
                  "resolved from the config layer, not from github.repository.\n"
              )
              sys.exit(2)

          canonical_git_url = "https://%s/%s.git" % (hosts[0], forgejo_repo)
          sys.stdout.write("CANONICAL_GIT_URL=%s\n" % canonical_git_url)
          sys.stderr.write(
              "canonical git URL from .ops.yaml: %s\n" % canonical_git_url
          )
          CANONICAL_URL_PY

      # faigrid publishes no built distribution — it is an installer repository,
      # there is no PyPI claim, and distribution to the Homebrew tap runs from
      # the mirror side (notify-tap.yml). The assets directory is created and
      # left empty so the engine attaches nothing rather than failing on a
      # missing path.
      - name: Publish the release to every destination
        env:
          TAG_NAME: "${{ github.event.inputs.tag_name || github.ref_name }}"
          NOTES: "${{ needs.gate.outputs.notes }}"
          NAME_TEMPLATE: "${{ needs.gate.outputs.release_name_template }}"
          FORGEJO_REPOSITORY: "${{ github.repository }}"
          FORGEJO_BASE_URL: "${{ github.server_url }}"
          FORGEJO_TOKEN: "${{ secrets.GITHUB_TOKEN }}"
          GH_MIRROR_TOKEN: "${{ secrets.GH_MIRROR_TOKEN }}"
          # CANONICAL_GIT_URL is not set here: it is derived by the step above
          # from .ops.yaml's forge_hosts and the forgejo destination's repo, and
          # exported to this step through $GITHUB_ENV. github.server_url is never
          # a fallback — on the self-hosted Forgejo runner it is the internal
          # container address, not the organisation's forge.
        run: |
          set -euo pipefail

          # release-assets is created and left empty: faigrid ships no built
          # distribution (notify-tap.yml hashes the source archive instead). The
          # directory existing is what `release_attach --artifacts` requires; an
          # empty one is what makes the engine attach nothing rather than fail
          # on a missing path.
          mkdir -p release-assets

          # ------------------------------------------------------------------
          # The engine: the 3.7.3 wheel, pinned by VERSION and by CONTENT HASH.
          #
          # The former VCS install is gone. A VCS install resolves to whatever
          # the tag pointed at when the runner fetched it, so the engine was
          # never pinned by bytes. The wheel's sha256 is checked BEFORE it is
          # installed and the installed version is read back afterwards: a
          # truncated, redirected or substituted download is named here, never
          # trusted.
          # ------------------------------------------------------------------
          WHEEL_FILE="$(mktemp -d)/ops_engine-3.7.3-py3-none-any.whl"
          WHEEL_URL="https://github.com/LangeVC/ops-engine/releases/download/v3.7.3/ops_engine-3.7.3-py3-none-any.whl"
          WHEEL_SHA256="865fdd6f15b525123b3b5fc7f40193afd959be50244be8c4dab8c15668798959"
          curl -fsSL "$WHEEL_URL" -o "$WHEEL_FILE"
          python3 - "$WHEEL_FILE" "$WHEEL_SHA256" <<'WHEEL_DIGEST_PY'
          import hashlib
          import sys

          path, expected = sys.argv[1], sys.argv[2]
          with open(path, "rb") as fh:
              got = hashlib.sha256(fh.read()).hexdigest()
          if got != expected:
              sys.stderr.write(
                  "WheelDigestError: %s has sha256 %s, expected %s; refusing to "
                  "install an engine wheel whose bytes are not the pinned ones.\n"
                  % (path, got, expected)
              )
              sys.exit(2)
          sys.stdout.write("engine wheel verified: sha256:%s\n" % got)
          WHEEL_DIGEST_PY

          # The engine installs into an isolated venv outside the source tree:
          # the runner's system interpreter is PEP 668 externally managed, and an
          # in-tree venv would become part of anything this repository packages.
          ENGINE_VENV="$(mktemp -d)/engine-venv"
          python3 -m venv "$ENGINE_VENV"
          "$ENGINE_VENV/bin/python" -m pip install --quiet "$WHEEL_FILE"

          # Prove what was installed, from the interpreter that runs the CLI
          # below: a wheel that installed but left a stale version behind is
          # named here rather than at publication.
          "$ENGINE_VENV/bin/python" - <<'ENGINE_VERSION_PY'
          import importlib.metadata as md
          import sys

          REQUIRED = "3.7.3"
          got = md.version("ops-engine")
          if got != REQUIRED:
              sys.stderr.write(
                  "EngineVersionError: installed ops-engine %s, required %s. "
                  "Refusing to publish with an engine other than the pinned one.\n"
                  % (got, REQUIRED)
              )
              sys.exit(2)
          sys.stdout.write("engine: ops-engine %s\n" % got)
          ENGINE_VERSION_PY

          # ------------------------------------------------------------------
          # The mirror tag: KEPT, repository-specific.
          #
          # `release_attach` never pushes a tag. `push_canonical_tag` lives in
          # `ops_engine.modules.tag_identity` (tag_identity.py:182) and is called
          # only from `_release_tag` (release.py:2536), which the WEBHOOK path
          # reaches; `publish_release` — the function `release_attach` wires —
          # does not call it. The four-step identity sequence therefore cannot
          # come from the entry point and stays here:
          #   1. read the CANONICAL tag's object and peel from the forge with
          #      this run's credential (the workspace ref may have been degraded
          #      to lightweight by actions/checkout, so it cannot answer),
          #   2. re-point the workspace ref at that OBJECT,
          #   3. push the OBJECT (never the ref name) onto the mirror,
          #   4. read the mirror back and compare object AND peel.
          # It runs BEFORE the attach, so the GitHub create_release finds the tag
          # already present and cannot invent one at the mirror's default-branch
          # head, and again AFTER it, to prove publication did not change the
          # identity. A release that leaves the mirror tag degraded is refused
          # with a named error, never accepted.
          # ------------------------------------------------------------------
          MIRROR_TAG="$RUNNER_TEMP/mirror_tag.py"
          cat > "$MIRROR_TAG" <<'MIRROR_TAG_PY'
          """The canonical tag OBJECT is what reaches the mirror.

          Repository-specific: ops_engine.release_attach never pushes a tag, so
          this workflow carries the four-step identity sequence itself. Every
          refusal is named; nothing is pushed before the canonical identity is
          established, and the mirror is read back object-for-object.
          """

          import os
          import subprocess
          import sys

          from ops_engine.config_loader import load_ops_yaml


          def _github_repo(layer3):
              """The mirror destination's repository, from the committed
              .ops.yaml. The repository is never a literal in this file."""
              for dest in layer3.destinations:
                  if dest.forge.strip().lower() == "github":
                      return dest.repo
              return ""


          def _mirror_remote(github_repo):
              """The github destination's push remote, built from the repo value
              the config layer resolved plus the mirror credential."""
              return (
                  "https://x-access-token:%s@github.com/%s.git"
                  % (os.environ["GH_MIRROR_TOKEN"], github_repo)
              )


          def _authenticated_url(url, token):
              """Embed the forge credential this workflow already holds into a
              URL for a single git invocation.

              The canonical repository is not anonymously readable, so a
              credential-less ls-remote reads nothing. The credential is
              `secrets.GITHUB_TOKEN`, exposed to this step as FORGEJO_TOKEN. The
              credential-bearing string is handed to git and never formatted
              into a log line: every message names the credential-free URL.

              Only an absolute URL is authenticated. A value without a scheme is
              NOT a forge URL and is returned unchanged rather than given a
              credential."""
              scheme, sep, rest = url.partition("://")
              if not sep:
                  return url
              return "%s://x-access-token:%s@%s" % (scheme, token, rest)


          def _tag_refs(tag_name):
              """The CANONICAL tag's object SHA and peeled commit SHA, read from
              the canonical forge — never from the workspace checkout.

              actions/checkout decides identity with `testRef(ref) ===
              revParse(ref)`, and for an ANNOTATED tag `revParse(refs/tags/X)`
              is the TAG OBJECT, not the commit the run is checked out at. The
              ref is therefore re-fetched as `+<commit>:refs/tags/X`, leaving a
              LIGHTWEIGHT local ref, and a workspace comparison would degrade to
              lightweight-vs-lightweight and pass while Forgejo still holds the
              tag object (FRL-007).

              The forge refuses the anonymous read, so this ls-remote carries the
              credential the workflow already holds. A missing credential, or a
              credential the forge rejects, is a NAMED refusal: it never falls
              back to the degraded workspace ref or to github.server_url."""
              src = os.environ["CANONICAL_GIT_URL"]
              token = os.environ.get("FORGEJO_TOKEN", "").strip()
              if not token:
                  print(
                      "::error::MissingForgejoCredentialError: FORGEJO_TOKEN is "
                      "empty; the canonical forge %s is not anonymously readable, "
                      "so its tag identity cannot be read. Refusing to fall back "
                      "to the degraded workspace ref or to github.server_url." % src,
                      file=sys.stderr,
                  )
                  sys.exit(2)
              auth_src = _authenticated_url(src, token)
              # No check=True: a rejected credential must be reported by name, not
              # raised as a CalledProcessError whose text carries the auth URL.
              ls = subprocess.run(
                  ["git", "ls-remote", auth_src,
                   "refs/tags/%s" % tag_name, "refs/tags/%s^{}" % tag_name],
                  capture_output=True, text=True,
              )
              if ls.returncode != 0:
                  print(
                      "::error::CanonicalTagUnreadableError: git ls-remote against "
                      "the canonical forge %s failed (exit %s); the tag identity "
                      "could not be read. Refusing before anything is pushed or "
                      "published. git diagnostics are withheld because they can "
                      "carry the credential." % (src, ls.returncode),
                      file=sys.stderr,
                  )
                  sys.exit(2)
              refs = {}
              for line in ls.stdout.splitlines():
                  sha, _, ref = line.partition("\t")
                  refs[ref] = sha.strip()
              obj = refs.get("refs/tags/%s" % tag_name, "")
              peeled = refs.get("refs/tags/%s^{}" % tag_name, "")
              if not obj:
                  print(
                      "::error::MissingCanonicalTagError: tag %s does not exist "
                      "on the canonical forge %s; refusing before anything is "
                      "pushed or published."
                      % (tag_name, src),
                      file=sys.stderr,
                  )
                  sys.exit(2)
              # A lightweight canonical tag has no peel line; the tag object IS
              # the commit. The absence is reported by name rather than silently
              # normalised.
              if not peeled:
                  print(
                      "::message::tag %s is lightweight on the canonical forge "
                      "(no peel line); the mirror must match it lightweight."
                      % tag_name
                  )
                  peeled = obj
              return obj, peeled


          def _rebuild_canonical_ref(tag_name, obj, peel):
              """Point the workspace tag at the CANONICAL tag OBJECT, so the push
              below transfers the same identity the comparison expects.

              Fixing only the comparison would leave the pre-publish push sending
              the degraded lightweight ref — and that push is what corrupts the
              mirror. The tag object is already in the workspace: the fetch that
              degraded the ref brought the object with it, so `update-ref` simply
              re-points the local ref at it. A missing object is a named refusal
              rather than a silent fallback to the degraded ref."""
              try:
                  kind = subprocess.check_output(
                      ["git", "cat-file", "-t", obj], text=True
                  ).strip()
                  actual_peel = subprocess.check_output(
                      ["git", "rev-parse", "%s^{}" % obj], text=True
                  ).strip()
              except subprocess.CalledProcessError:
                  print(
                      "::error::MissingCanonicalTagObjectError: canonical object "
                      "%s for tag %s is not in the workspace; refusing to push a "
                      "tag whose identity cannot be established." % (obj, tag_name),
                      file=sys.stderr,
                  )
                  sys.exit(2)
              if actual_peel != peel:
                  print(
                      "::error::CanonicalTagUnreachableError: canonical object %s "
                      "for tag %s peels to %s, expected %s; refusing to push an "
                      "unverified tag object." % (obj, tag_name, actual_peel, peel),
                      file=sys.stderr,
                  )
                  sys.exit(2)
              subprocess.run(
                  ["git", "update-ref", "refs/tags/%s" % tag_name, obj],
                  check=True,
              )
              print(
                  "canonical tag object restored in workspace: %s -> %s (%s)"
                  % (tag_name, obj, kind)
              )


          def _push_mirror_tag(tag_name, remote, obj):
              """Push the canonical tag OBJECT onto the mirror.

              The source is the canonical object SHA, not the workspace ref name.
              `git push remote <sha>:refs/tags/X` sends that object and only
              succeeds if the remote accepts it under the tag name — a forged or
              foreign object is refused by the push itself. Pushing the ref NAME
              instead would forward whatever the workspace ref happens to be, and
              a degraded lightweight ref is precisely what must not be sent."""
              subprocess.run(
                  ["git", "push", "--force", remote,
                   "%s:refs/tags/%s" % (obj, tag_name)],
                  check=True,
              )


          def _verify_mirror_tag(tag_name, canonical_obj, canonical_peel, remote):
              """Compare the mirror tag's OBJECT, not just its peel, and refuse
              by name on divergence.

              `ls-remote` emits both `refs/tags/X` (the tag object for an
              annotated tag, or the commit for a lightweight one) and, only when
              annotated, `refs/tags/X^{}` (the peeled commit). The raw object SHA
              is the identity that MUST agree: an annotated canonical tag beside
              a lightweight mirror tag differs in its raw SHA even when the peels
              agree, which is precisely the divergence a peel-only comparison
              cannot see."""
              ls = subprocess.run(
                  ["git", "ls-remote", remote,
                   "refs/tags/%s" % tag_name, "refs/tags/%s^{}" % tag_name],
                  capture_output=True, text=True,
              )
              targets = {}
              for line in ls.stdout.splitlines():
                  sha, _, ref = line.partition("\t")
                  targets[ref] = sha.strip()
              mirror_obj = targets.get("refs/tags/%s" % tag_name, "")
              mirror_peel = targets.get("refs/tags/%s^{}" % tag_name)

              if not mirror_obj:
                  print(
                      "::error::MirrorTagDriftError: tag %s has no mirror ref; "
                      "the mirror tag does not exist. Refusing the release."
                      % tag_name,
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if mirror_obj != canonical_obj:
                  print(
                      "::error::MirrorTagObjectMismatchError: tag %s has object "
                      "%s on the canonical forge but object %s on the mirror; "
                      "the mirror tag is not the same tag object (annotated vs "
                      "lightweight divergence). Refusing the release."
                      % (tag_name, canonical_obj, mirror_obj),
                      file=sys.stderr,
                  )
                  sys.exit(1)

              if mirror_peel is not None and mirror_peel != canonical_peel:
                  print(
                      "::error::MirrorTagDriftError: tag %s peels to %s on the "
                      "canonical forge but %s on the mirror. Refusing the release."
                      % (tag_name, canonical_peel, mirror_peel),
                      file=sys.stderr,
                  )
                  sys.exit(1)

              print(
                  "mirror tag verified: %s -> object %s (peel %s)"
                  % (tag_name, mirror_obj, mirror_peel or mirror_obj)
              )


          def main(argv):
              mode = argv[1] if len(argv) > 1 else "push"
              layer3 = load_ops_yaml(".")
              if layer3 is None:
                  print(
                      "::error::MissingOpsYamlError: no .ops.yaml at the "
                      "repository root; the mirror destination is a committed "
                      "file, not a CI variable. Refusing to mirror a tag whose "
                      "destination cannot be resolved.",
                      file=sys.stderr,
                  )
                  return 2
              github_repo = _github_repo(layer3)
              if not github_repo:
                  print("no github destination declared; nothing to mirror")
                  return 0
              tag_name = os.environ["TAG_NAME"]
              remote = _mirror_remote(github_repo)
              if mode == "push":
                  # The order is deliberate: read the canonical identity, rebuild
                  # the workspace ref, push the OBJECT, re-check the mirror. The
                  # rebuild is what stops the corruption; the check is the proof
                  # it did not happen.
                  obj, peel = _tag_refs(tag_name)
                  _rebuild_canonical_ref(tag_name, obj, peel)
                  _push_mirror_tag(tag_name, remote, obj)
                  _verify_mirror_tag(tag_name, obj, peel, remote)
              elif mode == "verify":
                  obj, peel = _tag_refs(tag_name)
                  _verify_mirror_tag(tag_name, obj, peel, remote)
              else:
                  print(
                      "::error::MirrorTagModeError: unknown mode %r; expected "
                      "push or verify." % mode,
                      file=sys.stderr,
                  )
                  return 2
              return 0


          sys.exit(main(sys.argv))
          MIRROR_TAG_PY

          # Before publication: the mirror holds the canonical OBJECT, so the
          # GitHub release creation finds the tag and cannot invent one.
          "$ENGINE_VENV/bin/python" "$MIRROR_TAG" push

          # The notes file holds the CHANGELOG section verbatim with no added
          # trailing newline: the engine appends the one newline the composed
          # body needs, so an extra one would diverge from the bodies already on
          # both forges.
          NOTES_FILE="$(mktemp)"
          trap 'rm -f "$NOTES_FILE"' EXIT
          printf '%s' "$NOTES" > "$NOTES_FILE"

          # Publication is ONE command. It reads the destinations, the release
          # block and release.assets from the .ops.yaml in --repo-dir — the same
          # declaration the census reads — so this workflow ships no second
          # declaration that could drift. Each destination reads its token from
          # the variable IT declares (credential_variable), and the CHANGELOG
          # link is derived from the declared forge_hosts, never from
          # FORGEJO_BASE_URL. --name-template is the gate job's
          # release_name_template output, so the title a release already carries
          # is the title this run renders; a missing template would rewrite it.
          "$ENGINE_VENV/bin/python" -m ops_engine.release_attach \
            --repo "$FORGEJO_REPOSITORY" \
            --tag "$TAG_NAME" \
            --artifacts release-assets \
            --repo-dir . \
            --name-template "$NAME_TEMPLATE" \
            --notes-file "$NOTES_FILE"

          # After publication: refuse by name if the mirror tag is not the SAME
          # OBJECT the canonical tag is, or if the peels disagree. The canonical
          # side is re-read from the forge, not from the workspace, so the
          # comparison cannot be satisfied by a degraded local ref.
          "$ENGINE_VENV/bin/python" "$MIRROR_TAG" verify
